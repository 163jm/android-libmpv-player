name: Build arm64 APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Pin Gradle 8.13 — AGP 8.13.x is incompatible with Gradle 9.6+
      # (InternalProblems API removed). Do NOT use the runner's system Gradle.
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Build Debug APK (arm64-v8a only)
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK (arm64-v8a only)
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: List outputs
        run: find app/build/outputs -name "*.apk" -ls
